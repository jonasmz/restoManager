# Reverse proxy de desarrollo: un único origin para frontend + ambas APIs, ruteado
# por path. Elimina la necesidad de CORS y de hardcodear host/IP en el frontend —
# ver deploy/docker-compose.yml y frontend/src/app/core/config/environment.ts.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Nombres de servicio de docker-compose, resueltos por el DNS interno de Docker.
    upstream frontend       { server frontend:4200; }
    upstream backend_auth   { server backend-auth:8080; }
    upstream backend_business { server backend-business:8080; }

    server {
        listen 80;

        # Auth API: login/refresh/logout. Expuesta en /api/auth/ (no /auth/ a secas)
        # porque el frontend tiene su propia ruta de Angular /auth/signin — con
        # /auth/ el proxy se la comía antes de que la sirviera `ng serve`. El
        # backend sigue mapeando sus endpoints bajo /auth/*; se reescribe acá.
        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://backend_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            proxy_pass http://backend_auth;
            proxy_set_header Host $host;
        }

        # Business API: REST /api/v1/** + imágenes de la carta (Fase 11).
        location /api/v1/ {
            proxy_pass http://backend_business;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 5m; # subida de imagen del plato
        }

        # Solo /media/menu/ (prefijo real de Program.cs), no /media/ entero: el CSS
        # de @tabler/icons-webfont también sirve sus fuentes bajo /media/tabler-*,
        # y con /media/ a secas el proxy se las mandaba (mal) al Business API.
        location /media/menu/ {
            proxy_pass http://backend_business;
            proxy_set_header Host $host;
        }

        # Frontend Angular (ng serve). Upgrade/Connection: soporte de websocket para
        # el live-reload del dev server.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
