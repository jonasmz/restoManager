# Entorno de desarrollo — un contenedor por tecnología.
# Uso: desde la raíz del repo:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: resto-manager

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto}
      POSTGRES_DB: ${POSTGRES_DB:-resto_business}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resto} -d ${POSTGRES_DB:-resto_business}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-auth:
    build:
      context: ..
      dockerfile: deploy/backend.dev.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      API_PROJECT: src/RestoManager.Auth.Api
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=resto_identity;Username=${POSTGRES_USER:-resto};Password=${POSTGRES_PASSWORD:-resto}"
      # Emisor lógico = dirección de red del servicio, para que el descubrimiento OIDC
      # de la Business API (iss + jwks_uri) sea coherente y alcanzable.
      Auth__Issuer: "http://backend-auth:8080"
      # Orígenes permitidos para llamadas directas a esta API (fuera de nginx, que
      # comparte origin con el frontend y no necesita CORS). Lista indexada — ver
      # CORS_ORIGIN_0/1/2 en deploy/.env.example para agregar la IP LAN o un dominio.
      Cors__Origins__0: "${CORS_ORIGIN_0:-http://localhost}"
      Cors__Origins__1: "${CORS_ORIGIN_1:-}"
      Cors__Origins__2: "${CORS_ORIGIN_2:-}"
    command: ["bash", "-lc", "dotnet restore && dotnet watch run --project src/RestoManager.Auth.Api --non-interactive --no-launch-profile"]
    volumes:
      - ../backend/auth:/src
      - auth_nuget:/root/.nuget/packages
      - auth_obj:/src/src/RestoManager.Auth.Api/obj
      - auth_bin:/src/src/RestoManager.Auth.Api/bin
    # Sin `ports:`: solo se accede vía nginx (servicio `nginx`) o `docker compose exec`.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  backend-business:
    build:
      context: ..
      dockerfile: deploy/backend.dev.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      API_PROJECT: src/RestoManager.Business.Api
      ConnectionStrings__BusinessDb: "Host=postgres;Port=5432;Database=resto_business;Username=${POSTGRES_USER:-resto};Password=${POSTGRES_PASSWORD:-resto}"
      Auth__Authority: "http://backend-auth:8080"
      Auth__Audience: "resto"
      # Fase 11: almacén de imágenes de la carta (servidas en /media/menu).
      Storage__MenuImagesPath: "/var/lib/resto/menu-images"
      # Ver el mismo comentario en backend-auth.
      Cors__Origins__0: "${CORS_ORIGIN_0:-http://localhost}"
      Cors__Origins__1: "${CORS_ORIGIN_1:-}"
      Cors__Origins__2: "${CORS_ORIGIN_2:-}"
    command: ["bash", "-lc", "dotnet restore && dotnet watch run --project src/RestoManager.Business.Api --non-interactive --no-launch-profile"]
    volumes:
      - ../backend/business:/src
      - business_nuget:/root/.nuget/packages
      - business_obj:/src/src/RestoManager.Business.Api/obj
      - business_bin:/src/src/RestoManager.Business.Api/bin
      - menu_images:/var/lib/resto/menu-images
    # Sin `ports:`: solo se accede vía nginx (servicio `nginx`) o `docker compose exec`.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.dev.Dockerfile
    environment:
      NODE_ENV: development
      # Config runtime (window.__env, ver public/env.example.js): por defecto,
      # rutas relativas al origin actual, resuelto por nginx. AUTH_BASE_URL usa
      # /api/auth (no /api a secas): el frontend tiene su propia ruta /auth/signin
      # (la Auth API se expone en /api/auth/ para no pisarla), y no debe ser
      # prefijo de las rutas de la Business API (/api/v1/...) o el interceptor de
      # auth confundiría esas llamadas con llamadas a la Auth API — ver
      # deploy/nginx/nginx.conf y frontend/src/app/core/config/environment.ts.
      API_BASE_URL: "${API_BASE_URL:-}"
      AUTH_BASE_URL: "${AUTH_BASE_URL:-/api/auth}"
    command:
      - sh
      - -lc
      - |
        printf 'window.__env = { apiBaseUrl: "%s", authBaseUrl: "%s" };\n' "$$API_BASE_URL" "$$AUTH_BASE_URL" > public/env.js
        npm install --no-fund --no-audit
        exec npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    # Sin `ports:`: solo se accede vía nginx (servicio `nginx`) o `docker compose exec`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend-auth:
        condition: service_healthy
      backend-business:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  auth_nuget:
  auth_obj:
  auth_bin:
  business_nuget:
  business_obj:
  business_bin:
  menu_images:
  frontend_node_modules:
